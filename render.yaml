# Render 배포 설정 (Blueprint)
#
# 쓰는 법
#   1. render.com 에 GitHub 계정으로 로그인
#   2. New → Blueprint → 이 저장소 선택 → Apply
#   3. 웹 서비스가 만들어집니다. DB 는 Neon 무료 Postgres(neon.tech, 만료 없음)를 따로 만들고
#      그 연결 문자열을 Environment 의 DATABASE_URL 에 넣으세요 (2026-09-24 부터. Render 무료 Postgres 는
#      만든 지 30일 뒤 만료돼 심사 기간에 걸렸다). 지역은 이 웹 서비스와 같은 곳으로.
#   4. 배포 후 Environment 에서 PUBLIC_BASE_URL 을 실제 주소로 채우세요
#      (예: https://quadriga-fitness-age.onrender.com)
#      이 값이 OAuth 리디렉션 URI 와 쿠키 보안 설정의 기준이 됩니다
#   5. 소셜 로그인을 쓰려면 각 CLIENT_ID/SECRET 도 여기에 넣습니다
#      (파일에 적지 말고 Render 대시보드에서 입력)

services:
  - type: web
    name: quadriga-fitness-age
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # Neon 연결 문자열 (postgresql://…neon.tech/…?sslmode=require) — 대시보드에서 입력합니다.
      # 비워 두면 서버는 SQLite 로 뜨지만 배포 서버의 디스크는 재배포 때 사라지니 꼭 채우세요.
      - key: DATABASE_URL
        sync: false
      # 배포 후 실제 주소로 채우세요. 비워두면 프록시 헤더로 추정합니다.
      - key: PUBLIC_BASE_URL
        sync: false
      # 소셜 로그인 키 — 대시보드에서 입력합니다 (저장소에 두지 않습니다)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: DATA_GO_KR_KEY
        sync: false

# Render Postgres 는 더 쓰지 않는다 (무료 플랜 30일 만료). 여기서 지워도 이미 만들어진 DB 는 Render 가
# 스스로 삭제하지 않는다 — Neon 으로 옮긴 것을 확인한 뒤 대시보드에서 직접 지운다.
