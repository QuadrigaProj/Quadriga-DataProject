# Render 배포 설정 (Blueprint)
#
# 쓰는 법
#   1. render.com 에 GitHub 계정으로 로그인
#   2. New → Blueprint → 이 저장소 선택 → Apply
#   3. 웹 서비스와 Postgres 가 함께 만들어지고 DATABASE_URL 이 자동 연결됩니다
#   4. 배포 후 Environment 에서 PUBLIC_BASE_URL 을 실제 주소로 채우세요
#      (예: https://quadriga-fitness-age.onrender.com)
#      이 값이 OAuth 리디렉션 URI 와 쿠키 보안 설정의 기준이 됩니다
#   5. 소셜 로그인을 쓰려면 각 CLIENT_ID/SECRET 도 여기에 넣습니다
#      (파일에 적지 말고 Render 대시보드에서 입력)

services:
  - type: web
    name: quadriga-fitness-age
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: quadriga-db
          property: connectionString
      # 배포 후 실제 주소로 채우세요. 비워두면 프록시 헤더로 추정합니다.
      - key: PUBLIC_BASE_URL
        sync: false
      # 소셜 로그인 키 — 대시보드에서 입력합니다 (저장소에 두지 않습니다)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: DATA_GO_KR_KEY
        sync: false

databases:
  - name: quadriga-db
    plan: free
