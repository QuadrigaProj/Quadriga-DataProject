# 배포 서버가 잠들지 않게 5분마다 한 번 두드립니다.
#
# Render 무료 요금제는 15분 동안 들어오는 요청이 없으면 서버를 끕니다. 그다음 첫 접속은 서버를
# 다시 켜느라 30초~1분이 걸립니다 (2026-09-20 실측 32초). 심사처럼 "처음 여는 사람" 이 그 시간을
# 그대로 겪습니다. 15분이 채워지기 전에 /health 를 한 번씩 부르면 꺼지지 않습니다.
#
# 알아둘 것
#   - 깃허브의 예약 실행은 붐빌 때 10~20분씩 밀리거나 건너뜁니다. 그래서 15분보다 넉넉히 짧은
#     5분으로 둡니다 — 한 번 밀려도 다음 것이 막아 줍니다. 그래도 100% 는 아닙니다.
#     더 확실히 하려면 UptimeRobot 같은 감시 서비스(5분 간격)를 함께 쓰세요.
#   - 잠든 뒤에 돌았다면 이 요청이 서버를 깨웁니다. 그 1분 사이에 들어온 사람만 기다립니다.
#   - Render 의 무료 인스턴스 시간은 워크스페이스마다 한 달 750시간입니다. 서비스 하나를 한 달 내내
#     켜 두면 744시간이라 들어맞지만, 같은 워크스페이스에 무료 웹 서비스가 더 있으면 월말에 모자라
#     전부 멈춥니다.
#   - 끄려면 Actions 탭에서 이 워크플로를 Disable 하거나 이 파일을 지우면 됩니다.
#   - 저장소에 60일 동안 활동이 없으면 깃허브가 예약 실행을 스스로 멈춥니다.
name: 서버 깨워두기

on:
  schedule:
    # 정각은 깃허브가 가장 붐비는 때라 피한다 (2, 7, 12 … 57분)
    - cron: "2-59/5 * * * *"
  workflow_dispatch:          # Actions 탭에서 손으로도 돌릴 수 있게

# 앞의 것이 아직 돌고 있으면(서버가 깨어나는 중) 새로 시작한 것이 이어받는다.
concurrency:
  group: keep-warm
  cancel-in-progress: true

permissions: {}               # 저장소를 읽지도 쓰지도 않는다

env:
  APP_URL: https://quadriga-fitness-age.onrender.com

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: /health 를 한 번 부른다
        run: |
          # 잠들어 있었다면 깨어나는 데 1분쯤 걸린다 — 넉넉히 기다리고, 안 되면 한 번 더 해 본다.
          # 실패해도 빨간불은 켜지 않는다: 이 워크플로의 일은 "두드리는 것" 이지 감시가 아니다.
          for i in 1 2; do
            code=$(curl -s -o /dev/null -w "%{http_code} %{time_total}s" --max-time 100 "$APP_URL/health" || true)
            echo "시도 $i: $code"
            case "$code" in 200*) exit 0 ;; esac
            sleep 5
          done
          echo "::warning::서버가 200 을 주지 않았어요 ($code)"
